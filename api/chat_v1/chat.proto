syntax = "proto3";

package chat_v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/Kosfedev/chat-service/pkg/chat/gRPC;chat_v1";

service ChatV1 {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Update(UpdateRequest) returns (google.protobuf.Empty);
  rpc Delete(DeleteRequest) returns (google.protobuf.Empty);
  rpc AddUser(AddUserRequest) returns (google.protobuf.Empty);
  rpc RemoveUser(RemoveUserRequest) returns (google.protobuf.Empty);
}

message Chat {
  int64 id = 1;
  string name = 2;
  repeated int64 user_ids = 3;
  repeated int64 message_ids = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CreateRequest {
  string name = 1;
}

message CreateResponse {
  int64 id = 1;
}

message GetRequest {
  int64 id = 1;
}

message GetResponse {
  int64 id = 1;
  string name = 2;
  repeated int64 user_ids = 3;
  repeated int64 message_ids = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ListRequest {
  google.protobuf.Int64Value user_id = 1;
  google.protobuf.StringValue name = 2;
}

message ListResponse {
  repeated Chat chats = 1;
  int64 limit = 2;
  int64 offset = 3;
}

message UpdateRequest {
  int64 id = 1;
  google.protobuf.StringValue name = 2;
}

message DeleteRequest {
  int64 id = 1;
}

message AddUserRequest {
  int64 id = 1;
  int64 user_id = 2;
}

message RemoveUserRequest {
  int64 id = 1;
  int64 user_id = 2;
}